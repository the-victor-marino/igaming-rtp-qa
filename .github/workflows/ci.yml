name: iGaming RTP QA Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run QA test suite
        run: pytest -v --cov=src --cov-report=term-missing --junitxml=reports/results.xml

      - name: Generate RTP convergence report
        run: python run_simulation.py

      - name: Upload test + chart artifacts
        if: always()   # upload even if tests fail, so you can inspect results
        uses: actions/upload-artifact@v4
        with:
          name: rtp-qa-report
          path: |
            reports/
            rtp_convergence.png